<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witaj na stronie Microsoft Word 2013</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI"', 'sans-serif'],
                    },
                    colors: {
                        word: {
                            primary: '#2b579a',
                            hover: '#1a3763'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-xl bg-white shadow-lg rounded-lg overflow-hidden border border-gray-200">
        <header class="bg-word-primary text-white p-8 text-center">
            <h1 class="text-2xl sm:text-3xl font-light">
                Witaj na stronie <span class="font-semibold">Microsoft Word 2013</span>
            </h1>
        </header>

        <section class="p-8 space-y-4">
            <a href="https://scratch.mit.edu/users/Microsoft-Word-2013/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="block w-full text-center py-3.5 px-6 bg-word-primary text-white font-medium rounded-md hover:bg-word-hover transition-colors shadow-sm">
                Profil Scratch
            </a>

            <a href="https://discord.gg/AEGTTFEwSH" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="block w-full text-center py-3.5 px-6 bg-word-primary text-white font-medium rounded-md hover:bg-word-hover transition-colors shadow-sm">
                Serwer Discord
            </a>
        </section>
    </main>

</body>
</html>
